<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Red de tuberías y puntos de medición sobre fondo oscuro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131c"/>
      <stop offset="0.55" stop-color="#0a2231"/>
      <stop offset="1" stop-color="#07202b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14384d" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>

  <!-- curvas de nivel del terreno -->
  <g fill="none" stroke="#1b4a63" stroke-width="1.2" opacity="0.55">
    <path d="M-20 520C220 470 380 560 640 500S1060 430 1260 480 1500 520 1640 470"/>
    <path d="M-20 570C240 520 420 610 690 550S1090 480 1290 530 1520 570 1640 520"/>
    <path d="M-20 470C200 420 360 510 620 450S1030 380 1230 430 1480 470 1640 420"/>
  </g>

  <!-- red de tuberías -->
  <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M980 120L1130 150L1290 120L1430 200"/>
    <path d="M1130 150L1180 290L1320 340"/>
    <path d="M1180 290L1040 360L900 330"/>
    <path d="M1040 360L1090 470"/>
  </g>
  <g fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M1180 290L1320 340"/>
  </g>

  <!-- puntos de medición -->
  <g fill="#06131c" stroke-width="3">
    <circle cx="980" cy="120" r="12" stroke="#34d399"/>
    <circle cx="1130" cy="150" r="12" stroke="#34d399"/>
    <circle cx="1290" cy="120" r="12" stroke="#34d399"/>
    <circle cx="1430" cy="200" r="12" stroke="#34d399"/>
    <circle cx="1180" cy="290" r="14" stroke="#fbbf24"/>
    <circle cx="1320" cy="340" r="14" stroke="#fb7185"/>
    <circle cx="1040" cy="360" r="12" stroke="#34d399"/>
    <circle cx="900" cy="330" r="12" stroke="#34d399"/>
    <circle cx="1090" cy="470" r="12" stroke="#34d399"/>
  </g>
  <circle cx="1320" cy="340" r="30" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.8"/>

  <!-- gota -->
  <g transform="translate(1448 428)" opacity="0.9">
    <path d="M0 -62C0 -62 -42 -8 -42 24A42 42 0 0 0 42 24C42 -8 0 -62 0 -62Z" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <path d="M-16 22A18 18 0 0 0 4 42" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>

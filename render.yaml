# Blueprint de Render para la instancia pública de demostración (plan gratuito, disco efímero: la demo se vuelve a sembrar al reiniciar).
services:
  - type: web
    name: aqua-sentinel
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AQUA_PUBLIC_MODE
        value: "1"
      # Sustituye por el dominio que te asigne Render (o el tuyo).
      - key: AQUA_ALLOWED_HOSTS
        value: aqua-sentinel.onrender.com
      - key: AQUA_ALLOWED_ORIGINS
        value: https://aqua-sentinel.onrender.com
      # Cuenta de evaluación (rol OPERATOR, usuario judge). Se define en el panel de Render, nunca aquí (sync: false).
      - key: AQUA_JUDGE_PASSWORD
        sync: false
